name: Unit & Integration Tests
permissions:
  contents: read
on:
  pull_request:
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # The integration project derives `resilience_web_test` from this and
      # creates it on first run. See test/db/testDatabaseUrl.ts.
      DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres?schema=public&sslmode=disable
      BETTER_AUTH_SECRET: ci-secret-not-used-for-anything-real
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run unit and component tests
        run: npm run test
      - name: Run integration tests
        run: npm run test:integration
