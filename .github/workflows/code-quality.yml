name: Code Quality Tests
on:
  # No `branches:` filter, so a pull request gets the same checks whichever
  # branch it targets. Restricting this to `main` meant a PR stacked on another
  # PR ran no CI at all, which is exactly when you most want it.
  pull_request:
jobs:
  test:
    permissions:
      contents: read
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres?schema=public&sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Run Stylelint
        run: npm run stylelint:dry
      - name: Run Eslint
        run: npm run eslint:dry
      - name: Run Typescript
        run: npm run tsc
